services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle_db
    restart: always
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: 31082006
    volumes:
      - oracle_data:/opt/oracle/oradata

  backend:
    build: ./Backend
    container_name: flask_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - oracle

  frontend:
    build: ./frontend
    container_name: react_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  oracle_data:
